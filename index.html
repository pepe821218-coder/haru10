<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>하루10 영어회화</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="하루10">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#FFFFFF" id="themeColor">
<meta name="robots" content="noindex">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
:root{
  color-scheme:light;
  --paper:#FFFFFF; --card:#FFFFFF; --ink:#000000; --muted:#333333; --line:#D4D4D4;
  --accent:#0A6C7E; --accent-ink:#FFFFFF; --accent-soft:#E6F2F4; --stamp:#9A6200; --stamp-soft:#FBF1DE;
  --good:#1F6B3E; --good-soft:#E3F2E8; --bad:#A3321F; --bad-soft:#F8E5E1;
  --shadow:0 1px 2px rgba(0,0,0,.05); --fill:#F2F2F2;
  --sans:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
:root[data-mode="dark"]{
  color-scheme:dark;
  --paper:#000000; --card:#121212; --ink:#FFFFFF; --muted:#CCCCCC; --line:#3A3A3A;
  --accent:#4DB3C4; --accent-ink:#000000; --accent-soft:#12323A; --stamp:#E3AA4C; --stamp-soft:#33270F;
  --good:#62BE88; --good-soft:#12301D; --bad:#EE8573; --bad-soft:#3A1A15;
  --shadow:none; --fill:#1E1E1E;
}
*{box-sizing:border-box}
html,body{background:var(--paper)}
body{font-family:var(--sans);color:var(--ink);font-size:16px;line-height:1.55;-webkit-tap-highlight-color:transparent}
#app{max-width:520px;margin:0 auto;padding-inline:16px;padding-block:12px 120px}
h1,h2,h3{margin:0;text-wrap:balance;line-height:1.3}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:10px}
.mono{font-family:var(--mono);letter-spacing:.06em;text-transform:uppercase;font-size:11.5px;font-weight:600}
.muted{color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.sec{margin-top:28px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:10px}
.sec-h h2{font-size:17px;font-weight:700}

/* home header */
.top{display:flex;justify-content:space-between;align-items:center;padding-block:6px 14px}
.brand{font-weight:700;font-size:15px}
.brand b{color:var(--accent)}
.hello{font-size:22px;font-weight:700;margin-bottom:4px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.stat .n{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2}
.stat .l{font-size:12px;color:var(--muted)}

/* ticket */
.ticket{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.ticket .t-main{padding:18px 18px 16px}
.ticket .t-stub{padding:14px 18px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.perf{position:relative;height:0;border-top:2px dashed var(--line);margin:0 14px}
.perf::before,.perf::after{content:"";position:absolute;top:-11px;width:20px;height:20px;border-radius:50%;background:var(--paper);border:1px solid var(--line)}
.perf::before{left:-24px}.perf::after{right:-24px}
.t-code{display:flex;gap:8px;align-items:center;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:600;white-space:nowrap}
.chip.travel{background:var(--accent-soft);color:var(--accent)}
.chip.biz{background:var(--stamp-soft);color:var(--stamp)}
.chip.done{background:var(--good-soft);color:var(--good)}
.chip.wait{background:transparent;color:var(--muted);border:1px solid var(--line)}
.chip.today{background:var(--ink);color:var(--paper)}
.modebtn{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:13px;font-weight:600}
.t-title{font-size:24px;font-weight:700;margin-top:10px}
.t-en{color:var(--muted);font-size:15px;margin-top:2px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border-radius:12px;font-weight:600}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:var(--card);border:1px solid var(--line)}
.btn.soft{background:var(--accent-soft);color:var(--accent)}
.btn.block{width:100%}
.btn svg{width:14px;height:14px;flex:none}
.btn:disabled{opacity:.45;cursor:default}
.btn.sm{min-height:38px;padding:0 14px;font-size:14px;border-radius:10px}

/* week strip */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.wd{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.wd .dot{width:34px;height:34px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:13px;font-weight:700;color:var(--muted);background:var(--card)}
.wd.done .dot{background:var(--good);border-color:var(--good);color:#fff}
.wd.next .dot{border-color:var(--accent);color:var(--accent)}
.wd.rest .dot{border-style:dashed}

/* lesson list */
.lrow{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;text-align:left;width:100%}
.lrow .day{font-family:var(--mono);font-weight:600;font-size:12px;color:var(--muted);width:30px;flex:none}
.lrow .tx{flex:1;min-width:0}
.lrow .tt{font-weight:600}
.lrow .te{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* roadmap */
.stage{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.stage-h{padding:12px 14px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line)}
.stage-h b{font-size:15px}
.wk{display:grid;grid-template-columns:44px 1fr auto;gap:8px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);font-size:14px}
.wk:last-child{border-bottom:0}
.wk .wn{font-family:var(--mono);font-size:12px;font-weight:600;color:var(--muted)}
.wk.cur{background:var(--accent-soft)}

/* week chips */
.wchips{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.wchip{min-height:40px;border-radius:10px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;font-weight:700;font-variant-numeric:tabular-nums;font-size:15px}
.wchip.done{background:var(--good-soft);color:var(--good);border-color:transparent}
.wchip.sel{outline:2px solid var(--accent);outline-offset:1px}
.wchip.lock{color:var(--muted);background:var(--fill)}
.wchip.plan{color:var(--muted);border-style:dashed;opacity:.6}
/* settings */
.setting{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:14px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--fill);border-radius:10px;padding:3px;gap:3px}
.seg button{min-height:38px;border-radius:8px;font-size:14px;font-weight:500;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);font-weight:700;box-shadow:var(--shadow)}
.switch{width:50px;height:30px;border-radius:999px;background:var(--line);position:relative;flex:none;transition:background .2s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.switch[aria-checked="true"]{background:var(--accent)}
.switch[aria-checked="true"]::after{transform:translateX(20px)}
.note{font-size:13px;color:var(--muted);line-height:1.6}

/* lesson */
.lbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);margin-inline:-16px;padding:10px 16px 10px}
.lbar .row{justify-content:space-between}
.back{display:inline-flex;align-items:center;gap:4px;font-weight:600;min-height:40px;padding-right:8px}
.timer{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:14px;font-weight:600;color:var(--muted);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px 10px}
.prog{height:6px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:8px}
.prog i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
.steplabel{margin-top:8px;display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
.steplabel b{color:var(--ink)}
.stitle{font-size:22px;font-weight:700;margin:14px 0 4px}
.sdesc{color:var(--muted);font-size:14px;margin-bottom:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.scene-em{font-size:26px;font-weight:700;line-height:1.25}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:15px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-weight:500}

.line{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;padding:12px;border-radius:12px;background:var(--card);border:1px solid var(--line);transition:border-color .15s,background .15s}
.line.me{background:var(--accent-soft);border-color:transparent}
.line.playing{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset}
.spk{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-family:var(--mono);font-size:12px;font-weight:600;background:var(--fill);color:var(--ink)}
.line.me .spk{background:var(--accent);color:var(--accent-ink)}
.en{font-size:17px;font-weight:600;line-height:1.4}
.ko{font-size:14px;color:var(--muted);margin-top:2px}
.ctrls{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.toggle-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;font-size:14px;color:var(--muted)}

.exp{display:flex;flex-direction:column;gap:12px}
.pattern{font-size:22px;font-weight:700;line-height:1.3}
.pattern u{text-decoration:none;border-bottom:3px solid var(--stamp);padding-inline:2px}
.sub{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;background:var(--fill);width:100%;text-align:left}
.play{flex:none;width:36px;height:36px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.play svg{width:14px;height:14px}

.shadow-big{font-size:24px;font-weight:700;line-height:1.35}
.reps{display:flex;gap:10px;justify-content:center;margin:18px 0 6px}
.rep{width:18px;height:18px;border-radius:50%;border:2px solid var(--line)}
.rep.on{background:var(--good);border-color:var(--good)}
.pager{display:flex;justify-content:space-between;align-items:center;margin-top:14px}

.hint{border:2px dashed var(--accent);background:var(--card)}
.reveal{margin-top:10px}

.q-prompt{font-size:19px;font-weight:700;line-height:1.4}
.opt{width:100%;text-align:left;padding:14px;border-radius:12px;background:var(--card);border:2px solid var(--line);font-size:16px;font-weight:500}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.fb{padding:12px 14px;border-radius:12px;font-size:14px}
.fb.good{background:var(--good-soft);color:var(--good)}
.fb.bad{background:var(--bad-soft);color:var(--bad)}
.fb b{display:block;font-size:15px;margin-bottom:2px}

.bottom{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--paper);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px))}
.bottom .in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:1fr 2fr;gap:10px}

.stamp{width:150px;height:150px;border-radius:50%;border:4px double var(--stamp);color:var(--stamp);display:grid;place-items:center;margin:30px auto 10px;transform:rotate(-8deg);text-align:center}
.stamp b{display:block;font-size:30px;font-family:var(--mono);letter-spacing:.08em}
.stamp span{font-family:var(--mono);font-size:11px;letter-spacing:.1em}
@media (prefers-reduced-motion:no-preference){ .stamp{animation:thump .45s ease-out} @keyframes thump{from{transform:rotate(-8deg) scale(1.4);opacity:0}to{transform:rotate(-8deg) scale(1);opacity:1}} }
.att{border:2px solid var(--accent);border-radius:16px;padding:18px;background:var(--card)}
.att-h{font-size:30px;font-weight:700;line-height:1.2;font-variant-numeric:tabular-nums}
.att-h small{font-size:15px;font-weight:600;color:var(--muted);margin-left:6px}
.att-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.att-grid div{background:var(--fill);border-radius:10px;padding:10px}
.att-grid b{display:block;font-size:20px;font-variant-numeric:tabular-nums}
.att-grid span{font-size:12px;color:var(--muted)}
.meter{height:10px;border-radius:99px;background:var(--fill);overflow:hidden;margin-top:6px}
.meter i{display:block;height:100%;background:var(--accent);border-radius:99px}
.banner{padding:10px 12px;border-radius:10px;background:var(--stamp-soft);color:var(--ink);font-size:13px}
html,body{margin:0}
body{-webkit-text-size-adjust:100%;padding-top:env(safe-area-inset-top,0px)}
.safe-cover{position:fixed;top:0;left:0;right:0;height:env(safe-area-inset-top,0px);background:var(--paper);z-index:30}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:13px;color:var(--muted)}
.field input,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sr-words{font-size:18px;font-weight:600;line-height:1.6}
.sr-words .ok{color:var(--good)}
.sr-words .miss{color:var(--bad);text-decoration:underline;text-decoration-thickness:2px}
.listening{animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{opacity:.6}}
</style>
</head>
<body>
<div class="safe-cover"></div>

<div id="app"></div>

<script>

const WEEKS_RAW = [{"week": 1, "theme": "여행과 업무에서 정중하게 요청하기", "roadmap": ["여행: 카페 주문·호텔 체크인", "비즈: 자기소개·회의 일정"], "lessons": [{"day": "월", "track": "여행", "title": "카페에서 음료 주문하기", "en": "Ordering at a Café", "scene": "여행지의 카페에서 원하는 음료를 주문하고 크기와 포장 여부를 말하는 상황입니다.", "goal": "원하는 음료를 정중하게 주문하고 추가 요청을 말할 수 있다.", "roles": {"A": "카페 직원", "B": "나"}, "lines": [{"s": "A", "en": "Hello. What can I get for you?", "ko": "안녕하세요. 무엇을 드릴까요?"}, {"s": "B", "en": "I'd like a hot latte, please.", "ko": "따뜻한 라테 한 잔 부탁합니다."}, {"s": "A", "en": "What size would you like?", "ko": "어떤 크기로 드릴까요?"}, {"s": "B", "en": "A medium, please.", "ko": "중간 크기로 부탁합니다."}, {"s": "A", "en": "Would you like anything else?", "ko": "다른 것도 필요하신가요?"}, {"s": "B", "en": "No, thank you. Can I get it to go?", "ko": "아니요, 괜찮습니다. 포장해 주실 수 있나요?"}, {"s": "A", "en": "Of course. That'll be five dollars.", "ko": "물론입니다. 5달러입니다."}, {"s": "B", "en": "Here you are. Thank you.", "ko": "여기 있습니다. 감사합니다."}], "exps": [{"p": "I'd like ___, please.", "ko": "___ 부탁합니다. (원하는 것을 정중하게 주문)", "subs": [["I'd like an iced coffee, please.", "아이스커피 한 잔 부탁합니다."], ["I'd like a cup of tea, please.", "차 한 잔 부탁합니다."], ["I'd like a sandwich, please.", "샌드위치 하나 부탁합니다."]]}, {"p": "Can I get ___?", "ko": "___ 받을 수 있을까요? / ___ 해주실 수 있나요?", "subs": [["Can I get it to go?", "포장해 주실 수 있나요?"], ["Can I get some water?", "물 좀 받을 수 있을까요?"], ["Can I get an extra cup?", "컵 하나 더 받을 수 있을까요?"]]}], "quiz": [{"q": "따뜻한 라테를 정중하게 주문할 때 알맞은 문장은?", "o": ["I'd like a hot latte, please.", "I hot latte yesterday.", "Where is the hot latte?"], "a": 0, "why": "I'd like ___, please.는 원하는 것을 정중하게 주문할 때 씁니다.", "id": "w1d1q1"}, {"q": "직원이 ‘What size would you like?’라고 물었습니다. 알맞은 대답은?", "o": ["It is very hot.", "A medium, please.", "I drink coffee."], "a": 1, "why": "크기를 묻는 질문이므로 크기로 답합니다.", "id": "w1d1q2"}, {"q": "음료를 포장해 달라고 요청하는 문장은?", "o": ["Can I get it to go?", "Can I sit here?", "Can I see the menu?"], "a": 0, "why": "to go는 매장에서 먹지 않고 가지고 간다는 뜻입니다.", "id": "w1d1q3"}], "sou "], ["Which line should I take?", "어느 노선을 타야 하나요?"]]}], "quiz": [{"q": "‘2호선으로 가려면 어디서 갈아타야 하나요?’를 영어로?", "o": ["Where should I change for Line 2?", "Where should I change to Line 2 at?", "Where do I changing for Line 2?"], "a": 0, "why": "change for + 노선 = ~으로 갈아타다.", "id": "w5d1q1"}, {"q": "‘Take the train toward Riverside.’의 뜻은?", "o": ["리버사이드 방면 열차를 타세요.", "리버사이드에서 열차를 내리세요.", "리버사이드역은 공사 중입니다."], "a": 0, "why": "toward = ~쪽으로, ~ 방면.", "id": "w5d1q2"}, {"q": "시청역까지는 몇 정거장인가요?", "o": ["세 정거장", "두 정거장", "다섯 정거장"], "a": 0, "why": "It's three stops from here. stop = 정거장.", "id": "w5d1q3"}], "id": "w5d1", "n": 1}, {"day": "화", "track": "여행", "title": "길을 잃었을 때 묻기", "en": "Asking for Directions", "scene": "거리에서 현지인에게 시립 박물관 가는 길을 묻고, 안내를 알아듣는 상황입니다.", "goal": "길 안내(도는 곳·위치·거리)를 알아듣고 다시 확인할 수 있다.", "roles": {"A": "현지인", "B": "나"}, "lines": [{"s": "A", "en": "You look a little lost. Can I help?", "ko": "길을 잃으신 것 같네요. 도와드릴까요?"}, {"s": "B", "en": "Yes, please. How can I get to the City Museum?", "ko": "네. 시립 박물관에 어떻게 가나요?"}, {"s": "A", "en": "Go straight for two blocks.", "ko": "두 블록 곧장 가세요."}, {"s": "B", "en": "Where should I turn?", "ko": "어디서 돌아야 하나요?"}, {"s": "A", "en": "Turn left at the bank. The museum will be on your right.", "ko": "은행에서 왼쪽으로 도세요. 박물관은 오른쪽에 있을 거예요."}, {"s": "B", "en": "So, I turn left at the bank, right?", "ko": "그러니까 은행에서 왼쪽으로 도는 거죠?"}, {"s": "A", "en": "That's right. It's about a five-minute walk.", "ko": "맞아요. 걸어서 5분 정도예요."}, {"s": "B", "en": "Thank you so much.", "ko": "정말 감사합니다."}], "exps": [{"p": "Turn ___ at the ___.", "ko": "___에서 ___으로 도세요. (길 안내 알아듣기)", "subs": [["Turn left at the bank.", "은행에서 왼쪽으로 도세요."], ["Turn right at the corner.", "모퉁이에서 오른쪽으로 도세요."], ["Turn right at the second light.", "두 번째 신호등에서 오른쪽으로 도세요."]]}, {"p": "It's about a ___ walk.", "ko": "걸어서 ___ 정도예요.", "subs": [["It's about a five-minute walk.", "걸어서 5분 정도예요."], ["It's about a ten-minute walk.", "걸어서 10분 정도예요."], ["It's about a two-minute walk from the station.", "역에 ": "w8d2q3"}], "id": "w8d2", "n": 2}, {"day": "수", "track": "비즈니스", "title": "현장 사정에 맞춰 납품일 조율하기", "en": "Adjusting a Delivery Date", "scene": "현장 휴무와 크레인 일정 때문에 공급업체와 납품 날짜·시간을 조정하는 상황입니다.", "goal": "현장 사정과 조건을 설명하고 가능한 날짜로 조율할 수 있다.", "roles": {"A": "공급업체 담당자 Kevin", "B": "나"}, "lines": [{"s": "A", "en": "We can deliver the panels on Monday, June 10th.", "ko": "6월 10일 월요일에 패널을 납품할 수 있습니다."}, {"s": "B", "en": "Monday is difficult for us. Our site is closed that day.", "ko": "월요일은 저희에게 어렵습니다. 그날 현장이 쉽니다."}, {"s": "A", "en": "I see. Would Tuesday work for you?", "ko": "그렇군요. 화요일은 괜찮으세요?"}, {"s": "B", "en": "Tuesday is fine, but it has to be before noon.", "ko": "화요일은 괜찮은데 정오 전이어야 합니다."}, {"s": "A", "en": "Why is that?", "ko": "왜 그런가요?"}, {"s": "B", "en": "The crane is only available in the morning.", "ko": "크레인을 오전에만 쓸 수 있거든요."}, {"s": "A", "en": "Okay. We'll arrive at 8 a.m. on Tuesday.", "ko": "알겠습니다. 화요일 오전 8시에 도착하겠습니다."}, {"s": "B", "en": "Perfect. Please call me thirty minutes before you arrive.", "ko": "좋습니다. 도착 30분 전에 전화 주세요."}], "exps": [{"p": "___ is difficult for us.", "ko": "___은 저희에게 어렵습니다.", "subs": [["Monday is difficult for us.", "월요일은 저희에게 어렵습니다."], ["That date is difficult for us.", "그 날짜는 저희에게 어렵습니다."], ["The afternoon is difficult for us.", "오후는 저희에게 어렵습니다."]]}, {"p": "It has to be ___.", "ko": "반드시 ___이어야 합니다. (조건 말하기)", "subs": [["It has to be before noon.", "정오 전이어야 합니다."], ["It has to be by Friday.", "금요일까지여야 합니다."], ["It has to be on a weekday.", "평일이어야 합니다."]]}], "quiz": [{"q": "‘그 날짜는 저희에게 어렵습니다’를 영어로?", "o": ["That date is difficult for us.", "That date is difficult to us.", "That date difficult for us."], "a": 0, "why": "difficult for + 사람.", "id": "w8d3q1"}, {"q": "화요일 오전이어야 하는 이유는?", "o": ["크레인을 오전에만 쓸 수 있어서", "현장이 오후에 닫아서", "담당자가 오후에 없어서"], "a": 0, "why": "The crane is only available in the morning.", "id": "w8d3q2"}, {"q": "최종 납품 일정은?", "o": ["화요일 오전 8시", "월요일 오전 8시", "화요일 정오"], "a": 0, "why": "We'll arrive at 8 a.m. on Tuesday.", "id": "w8d3q3"}], "id": "w8d3", "n": 3}, {"day": "목", "track": "비즈니스", "title": "파손 자재 교체 요청하기", "en": "Requesting Replacements", "scene": "입고된 패널 일부가 파손되어 공급업체에 알리고 교체품을 요청하는 상황입니다.", "goal": "파손 내용을 설명하고 교체 기한과 증빙을 주고받을 수 있다.", "roles": {"A": "공급업체 담당자 Kevin", "B": "나"}, "lines": [{"s": "A", "en": "Hi, {FIRST}. Did the delivery arrive okay?", "ko": "안녕하세요, {FIRST}. 납품은 잘 도착했나요?"}, {"s": "B", "en": "Mostly, but six panels arrived damaged.", "ko": "대부분 괜찮은데 패널 6장이 파손된 채 왔습니다."}, {"s": "A", "en": "I'm very sorry. Was the packaging damaged, too?", "ko": "정말 죄송합니다. 포장도 손상됐었나요?"}, {"s": "B", "en": "No. The boxes looked fine, but the corners were broken.", "ko": "아니요. 박스는 멀쩡했는데 모서리가 깨져 있었어요."}, {"s": "A", "en": "Could you send us some photos?", "ko": "사진을 좀 보내주실 수 있나요?"}, {"s": "B", "en": "Sure. I'll email them now. Can you replace them by Friday?", "ko": "네. 지금 메일로 보낼게요. 금요일까지 교체해 주실 수 있나요?"}, {"s": "A", "en": "Yes. We'll send replacements at no cost.", "ko": "네. 무상으로 교체품을 보내드리겠습니다."}, {"s": "B", "en": "Thank you. Please send me the tracking number.", "ko": "감사합니다. 운송장 번호를 보내주세요."}], "exps": [{"p": "___ arrived damaged.", "ko": "___이 파손된 채 도착했습니다.", "subs": [["Six panels arrived damaged.", "패널 6장이 파손된 채 도착했습니다."], ["Some of the doors arrived damaged.", "문 일부가 파손된 채 도착했습니다."], ["Two boxes arrived damaged.", "박스 2개가 파손된 채 도착했습니다."]]}, {"p": "Can you replace ___ by ___?", "ko": "___까지 ___을 교체해 주실 수 있나요?", "subs": [["Can you replace them by Friday?", "금요일까지 교체해 주실 수 있나요?"], ["Can you replace the doors by next week?", "다음 주까지 문을 교체해 주실 수 있나요?"], ["Can you replace the damaged parts by Monday?", "월요일까지 파손 부품을 교체해 주실 수 있나요?"]]}], "quiz": [{"q": "‘문 일부가 파손된 채 도착했습니다’를 영어로?", "o": ["Some of the doors arrived damaged.", "Some of the doors arrived damage.", "Some doors was arrived damaged."], "a": 0, "why": "arrive damaged = 파손된 상태로 도착하다. damaged(형용사) 형태를 씁니다.", "id": "w8d4q1"}, {"q": "‘at no cost’의 뜻은?", "o": ["무상으로", "원가로", "절반 가격으로"], "a": 0, "why": "at no cost = 비용 없이, 무료로.", "id": "w8d4q2"}, {"q": "공급업체가 요청한 것은?", "o": ["파손 사진", "영수증", "발주서 원본"], "a": 0, "why": "Could you send us some photos?", "id": "w8d4q3"}], "id": "w8d4", "n": 4}, {"day": "금", "track": "종합", "title": "납품 지연 보상과 재발 방지 요구하기", "en": "Following Up on a Late Delivery", "scene": "납품이 약속보다 3일 늦어 현장 일정에 차질이 생겨, 공급업체에 보상과 재발 방지 대책을 요구하는 상황입니다.", "goal": "문제의 영향을 설명하고 보상·대책을 정중하지만 분명하게 요구할 수 있다.", "roles": {"A": "공급업체 매니저", "B": "나"}, "lines": [{"s": "A", "en": "I heard about the delay. I apologize.", "ko": "지연 건은 들었습니다. 사과드립니다."}, {"s": "B", "en": "Thank you. The order arrived three days later than agreed.", "ko": "감사합니다. 주문품이 약속보다 3일 늦게 도착했어요."}, {"s": "A", "en": "It was held at the transfer center.", "ko": "환적 센터에서 묶여 있었습니다."}, {"s": "B", "en": "I understand, but it affected our site schedule.", "ko": "이해합니다만, 저희 현장 일정에 차질이 생겼습니다."}, {"s": "A", "en": "We'll refund the express shipping fee.", "ko": "특급 운송비를 환불해 드리겠습니다."}, {"s": "B", "en": "Thank you. Could you also send us a plan to prevent this?", "ko": "감사합니다. 재발 방지 계획도 보내주실 수 있나요?"}, {"s": "A", "en": "Yes. We'll ship earlier and add a backup carrier.", "ko": "네. 출고를 앞당기고 예비 운송사를 추가하겠습니다."}, {"s": "B", "en": "Good. Please send it in writing by the end of the day.", "ko": "좋습니다. 오늘 중으로 서면으로 보내주세요."}], "exps": [{"p": "It affected ___.", "ko": "그 일로 ___에 차질(영향)이 생겼습니다.", "subs": [["It affected our site schedule.", "그 일로 현장 일정에 차질이 생겼습니다."], ["It affected our production.", "그 일로 생산에 차질이 생겼습니다."], ["It affected our costs.", "그 일로 비용에 영향이 있었습니다."]]}, {"p": "Could you also send us ___?", "ko": "___도 보내주실 수 있나요?", "subs": [["Could you also send us a prevention plan?", "재발 방지 계획도 보내주실 수 있나요?"], ["Could you also send us the revised schedule?", "수정 일정도 보내주실 수 있나요?"], ["Could you also send us a written apology?", "서면 사과문도 보내주실 수 있나요?"]]}], "quiz": [{"q": "‘그 일로 생산에 차질이 생겼습니다’를 영어로?", "o": ["It affected our production.", "It effected our production.", "It was affect our production."], "a": 0, "why": "affect(동사) = 영향을 주다. effect는 주로 명사(결과, ", "What time does the ticket office opens?", "What time the ticket office open?"], "a": 0, "why": "does 뒤에는 동사원형 open을 씁니다.", "id": "w9d1q1"}, {"q": "주말 개관 시간은?", "o": ["10시", "9시", "2시"], "a": 0, "why": "On weekends, it opens at ten.", "id": "w9d1q2"}, {"q": "‘It lasts about an hour.’의 뜻은?", "o": ["한 시간 정도 걸려요.", "한 시간 전에 시작했어요.", "마지막 한 시간은 무료예요."], "a": 0, "why": "last = (시간이) 계속되다, 걸리다.", "id": "w9d1q3"}], "id": "w9d1", "n": 1}, {"day": "화", "track": "여행", "title": "현지 투어 예약하기", "en": "Booking a City Tour", "scene": "여행사에서 시티 투어 시간을 고르고 가격을 확인해 예약하는 상황입니다.", "goal": "선호를 말하고 다른 선택지를 물어 예약할 수 있다.", "roles": {"A": "여행사 직원", "B": "나"}, "lines": [{"s": "A", "en": "We have morning and afternoon city tours this Friday.", "ko": "이번 금요일에 오전·오후 시티 투어가 있습니다."}, {"s": "B", "en": "I'd prefer the morning. What time does it start?", "ko": "오전이 좋겠어요. 몇 시에 시작하나요?"}, {"s": "A", "en": "It starts at nine.", "ko": "9시에 시작합니다."}, {"s": "B", "en": "Nine is a little early for me. Is there a later one?", "ko": "9시는 저한테 좀 이르네요. 더 늦은 것도 있나요?"}, {"s": "A", "en": "There's one at eleven.", "ko": "11시에 하나 있습니다."}, {"s": "B", "en": "Eleven works for me. How much is it?", "ko": "11시가 좋겠네요. 얼마예요?"}, {"s": "A", "en": "It's forty dollars, including lunch.", "ko": "점심 포함 40달러입니다."}, {"s": "B", "en": "Great. I'd like to book one seat, please.", "ko": "좋습니다. 한 자리 예약할게요."}], "exps": [{"p": "I'd prefer ___.", "ko": "___이 더 좋겠어요. (선호 말하기)", "subs": [["I'd prefer the morning.", "오전이 더 좋겠어요."], ["I'd prefer a window seat.", "창가 자리가 더 좋겠어요."], ["I'd prefer a shorter tour.", "더 짧은 투어가 좋겠어요."]]}, {"p": "___ is a little ___ for me.", "ko": "___은 저한테 좀 ___네요.", "subs": [["Nine is a little early for me.", "9시는 저한테 좀 이르네요."], ["Six is a little late for me.", "6시는 저한테 좀 늦네요."], ["That's a little expensive for me.", "그건 저한테 좀 비싸네요."]]}], "quiz": [{"q": "‘그건 저한테 좀 비싸네요’를 영어로?", "o": ["That's a little expensive for me.", "That's a little expensive to me price.", "That's little expensive me."], "a": 0, "why": "a little + 형용사 + for me로 부드럽게 말합니다.", "id": "w9d2q1"}, {"q": "투어 가격에 포함된 것은?", "o": ["점심", "입장료", "호텔 픽업"], "a": 0, "why": "forty dollars, including lunch.", "id": "w9d2q2"}, {"q": "‘I'd prefer the morning.’의 뜻은?", "o": ["오전이 더 좋겠어요.", "오전을 미리 준비할게요.", "오전에는 바빠요."], "a": 0, "why": "I'd prefer ~ = ~이 더 좋겠어요.", "id": "w9d2q3"}], "id": "w9d2", "n": 2}, {"day": "수", "track": "비즈니스", "title": "발표 시작하기", "en": "Opening a Presentation", "scene": "협력사 담당자들 앞에서 자기소개를 하고, 오늘 발표 주제와 순서를 안내하는 상황입니다.", "goal": "발표를 시작하며 주제·순서·질문 방식을 안내할 수 있다.", "roles": {"A": "협력사 담당자 Ms. Taylor", "B": "나"}, "lines": [{"s": "A", "en": "Everyone's here, {FIRST}. Please go ahead.", "ko": "모두 오셨어요, {FIRST}. 시작하세요."}, {"s": "B", "en": "Thank you. Good morning, everyone. I'm {FIRST} {LAST} from {CO}.", "ko": "감사합니다. 안녕하세요, 여러분. {CO}의 {KNAME}입니다."}, {"s": "A", "en": "Welcome. What will you talk about today?", "ko": "환영합니다. 오늘 어떤 내용을 발표하시나요?"}, {"s": "B", "en": "Today, I'd like to talk about our supplier evaluation results.", "ko": "오늘은 저희 협력사 평가 결과에 대해 말씀드리겠습니다."}, {"s": "A", "en": "How long will it take?", "ko": "얼마나 걸리나요?"}, {"s": "B", "en": "About fifteen minutes. First, I'll explain the criteria. Then, I'll share the results.", "ko": "15분 정도입니다. 먼저 평가 기준을 설명하고, 그다음 결과를 공유하겠습니다."}, {"s": "A", "en": "Great. Can we ask questions during the presentation?", "ko": "좋네요. 발표 중에 질문해도 되나요?"}, {"s": "B", "en": "Please save your questions for the end.", "ko": "질문은 마지막에 해 주시기 바랍니다."}], "exps": [{"p": "Today, I'd like to talk about ___.", "ko": "오늘은 ___에 대해 말씀드리겠습니다.", "subs": [["Today, I'd like to talk about our new project.", "오늘은 저희 새 프로젝트에 대해 말씀드리겠습니다."], ["Today, I'd like to talk about this year's purchasing plan.", "오늘은 올해 구매 계획에 대해 말씀드리겠습니다."], ["Today, I'd like to talk about cost savings.", "오늘은 원가 절감에 대해 말씀드리겠습니다."]]}, {"p": "First, I'll ___. Then, I'll ___.", "ko": "먼저 ___하고, 그다음 ___하겠습니다. (발표 순서 안내)", "subs": [["First, I'll explain the criteria. Then, I'll share the results.", "먼저 기준을 설명하고, 그다음 결과를 공유하겠습니다."], ["First, I'll show the numbers. Then, I'll answer questions.", "먼저 수치를 보여드리고, 그다음 질문에 답하겠습니다."], ["First, I'll review the problem. Then, I'll suggest a solution.", "먼저 문제를 짚고, 그다음 해결책을 제안하겠습니다."]]}], "quiz": [{"q": "‘오늘은 원가 절감에 대해 말씀드리겠습니다’를 영어로?", "o": ["Today, I'd like to talk about cost savings.", "Today, I'd like to talk cost savings.", "Today, I like talking about cost savings."], "a": 0, "why": "talk about + 주제. (5주차의 discuss는 about 없이 쓰는 것과 비교해 두세요.)", "id": "w9d3q1"}, {"q": "발표 시간은?", "o": ["약 15분", "약 50분", "약 5분"], "a": 0, "why": "About fifteen minutes.", "id": "w9d3q2"}, {"q": "‘Please save your questions for the end.’의 뜻은?", "o": ["질문은 마지막에 해 주세요.", "질문을 저장해 주세요.", "질문은 받지 않습니다."], "a": 0, "why": "save A for B = A를 B까지 아껴 두다.", "id": "w9d3q3"}], "id": "w9d3", "n": 3}, {"day": "목", "track": "비즈니스", "title": "그래프로 단가 변화 설명하기", "en": "Explaining a Price Chart", "scene": "발표 중 그래프를 보여주며 동선(구리 케이블) 단가의 변화와 원인을 설명하는 상황입니다.", "goal": "수치의 증감과 원인, 이후 추세를 설명할 수 있다.", "roles": {"A": "협력사 담당자", "B": "나"}, "lines": [{"s": "A", "en": "What does this blue line show?", "ko": "이 파란 선은 무엇을 나타내나요?"}, {"s": "B", "en": "It shows the monthly price of copper cable.", "ko": "월별 동선(구리 케이블) 단가를 나타냅니다."}, {"s": "A", "en": "It goes up sharply in March.", "ko": "3월에 크게 오르네요."}, {"s": "B", "en": "Yes. The price rose by twelve percent in March.", "ko": "네. 3월에 단가가 12% 올랐습니다."}, {"s": "A", "en": "What caused the increase?", "ko": "상승 원인은 무엇이었나요?"}, {"s": "B", "en": "It was mainly because of higher copper prices.", "ko": "주로 구리 가격이 올랐기 때문입니다."}, {"s": "A", "en": "And after March?", "ko": "3월 이후는요?"}, {"s": "B", "en": "It went down slightly and has stayed stable since then.", "ko": "조금 내려간 뒤 그 이후로 안정적입니다."}], "exps": [{"p": "___ rose by ___.", "ko": "___이 ___ 올랐습니다.", "subs": [["The price rose by twelve percent.", "단가가 12% 올랐습니다."], ["Our costs rose by five percent.", "저희 비용이 5% 올랐습니다."], ["Sales rose by eighteen percent.", "매출이 18% 올랐습니다."]]}, {"p": "It was mainly because of ___.", "ko": "주로 ___ 때문이었습니다.", "subs": [["It was mainly because of higher copper prices.", "주로 구리 가격 상승 때문이었습니다."], ["It was mainly because of the exchange rate.", "주로 환율 때문이었습니다."], ["It was mainly because of shipping costs.", "주로 운송비 때문이었습니다."]]}], "quiz": [{"q": "‘단가가 12% 올랐습니다’를 영어로?", "o": ["The price rose by twelve percent.", "The price raised by twelve percent.", "The price rose twelve percent up."], "a": 0, "why": "rise(오르다)는 목적어 없이 씁니다. raise는 ‘~을 올리다’라서 뒤에 목적어가 필요합니다.", "id": "w9d4q1"}, {"q": "3월 단가 상승의 주요 원인은?", "o": ["구리 가격 상승", "환율", "운송비"], "a": 0, "why": "because of higher copper prices.", "id": "w9d4q2"}, {"q": "‘has stayed stable since then’의 뜻은?", "o": ["그 이후로 안정적입니다", "그때까지 안정적이었습니다", "그 이후로 계속 오릅니다"], "a": 0, "why": "since then = 그 이후로 (지금까지).", "id": "w9d4q3"}], "id": "w9d4", "n": 4}, {"day": "금", "track": "종합", "title": "출장지에서 가볍게 대화하기", "en": "Making Small Talk on a Business Trip", "scene": "출장 중 회의 전에 협력사 동료와 도시와 주말 계획에 대해 가볍게 대화하는 상황입니다.", "goal": "간단한 의견과 이유를 말하고 추천을 받아 대화를 이어갈 수 있다.", "roles": {"A": "협력사 동료 Daniel", "B": "나"}, "lines": [{"s": "A", "en": "So, how are you enjoying Singapore so far?", "ko": "그래서, 싱가포르는 지금까지 어때요?"}, {"s": "B", "en": "I love it. It's really easy to get around.", "ko": "정말 좋아요. 돌아다니기가 정말 편해요."}, {"s": "A", "en": "What do you like most about it?", "ko": "어떤 점이 제일 좋아요?"}, {"s": "B", "en": "The subway is clean and very convenient.", "ko": "지하철이 깨끗하고 아주 편리해요."}, {"s": "A", "en": "Do you have any plans for the weekend?", "ko": "주말에 계획 있어요?"}, {"s": "B", "en": "Not yet. Could you recommend a good place to visit?", "ko": "아직이요. 가볼 만한 곳 추천해 주실래요?"}, {"s": "A", "en": "You should try the river park. It's beautiful at night.", "ko": "강변 공원에 가 보세요. 밤에 아주 예뻐요."}, {"s": "B", "en": "Sounds great. I'll go there on Saturday.", "ko": "좋네요. 토요일에 가 볼게요."}], "exps": [{"p": "It's really easy to ___.", "ko": "___하기가 정말 편해요(쉬워요).", "subs": [["It's really easy to get around.", "돌아다니기가 정말 편해요."], ["It's really easy to find good food here.", "여기는 맛집 찾기가 정말 쉬워요."], ["It's really easy to use the subway.", "지하철 이용하기가 정말 쉬워요."]]}, {"p": "Could you recommend ___?", "ko": "___ 추천해 주실래요?", "subs": [["Could you recommend a good place to visit?", "가볼 만한 곳 추천해 주실래요?"], ["Could you recommend a good restaurant nearby?", "근처 괜찮은 식당 추천해 주실래요?"], ["Could you recommend something to buy as a gift?", "선물로 살 만한 것 추천해 주실래요?"]]}], "quiz": [{"q": "‘근처 괜찮은 식당 추천해 주실래요?’를 영어로?", "o": ["Could you recommend a good restaurant nearby?", "Could you recommend me a good restaurant near?", "Could you recommending a good restaurant nearby?"], "a": 0, "why": "recommend + 추천할 것. nearby(근처에)는 명사 뒤에 둡니다.", "id": "w9d5q1"}, {"q": "‘easy to get around’의 뜻은?", "o": ["돌아다니기 편한", "길을 잃기 쉬운", "둘러싸기 쉬운"], "a": 0, "why": "get around = 여기저기 돌아다니다.", "id": "w9d5q2"}, {"q": "B가 주말에 가기로 한 곳은?", "o": ["강변 공원", "박물관", "쇼핑몰"], "a": 0, "why": "You should try the river park.", "id": "w9d5q3"}], "id": "w9d5", "n": 5}]}, {"week": 10, "level": "중급", "theme": "렌터카·음식 확인 · 질문 대응과 발표 마무리", "roadmap": ["여행: 렌터카 점검·음식 재료 확인", "비즈: 질문 확인·발표 마무리"], "lessons": [{"day": "월", "track": "여행", "title": "렌터카 흠집 기록 요청하기", "en": "Checking a Rental Car", "scene": "렌터카를 받기 전에 기존 흠집을 발견하고 계약서에 기록해 달라고 요청하는 상황입니다.", "goal": "손상 상태를 설명하고 기록·사본을 요청할 수 있다.", "roles": {"A": "렌터카 직원", "B": "나"}, "lines": [{"s": "A", "en": "Before you leave, let's check the car together.", "ko": "출발 전에 차량을 함께 확인하시죠."}, {"s": "B", "en": "Sure. I noticed a long scratch on the rear door.", "ko": "네. 뒷문에 긴 흠집이 있던데요."}, {"s": "A", "en": "Thanks for pointing that out. Was it there when you got the car?", "ko": "알려주셔서 감사합니다. 차를 받으셨을 때부터 있었나요?"}, {"s": "B", "en": "Yes. Could you note it on the rental agreement?", "ko": "네. 대여 계약서에 기록해 주시겠어요?"}, {"s": "A", "en": "Of course. I'll take a photo and add a note.", "ko": "물론이죠. 사진을 찍고 메모를 남기겠습니다."}, {"s": "B", "en": "Could I get a copy of the updated agreement?", "ko": "수정된 계약서 사본을 받을 수 있을까요?"}, {"s": "A", "en": "Sure. I'll email it to you right now.", "ko": "네. 지금 바로 이메일로 보내드릴게요."}, {"s": "B", "en": "Thanks. That will prevent any problems later.", "ko": "감사합니다. 그러면 나중에 문제가 없겠네요."}], "exps": [{"p": "I noticed a ___ on the ___.", "ko": "___에 ___이 있는 걸 봤어요.", "subs": [["I noticed a scratch on the rear door.", "뒷문에 흠집이 있는 걸 봤어요."], ["I noticed a dent on the front bumper.", "앞 범퍼가 찌그러진 걸 봤어요."], ["I noticed a crack on the windshield.", "앞유리에 금이 간 걸 봤어요."]]}, {"p": "Could you note it on ___?", "ko": "___에 기록해 주시겠어요?", "subs": [["Could you note it on the rental agreement?", "대여 계약서에 기록해 주시겠어요?"], ["Could you note it on the delivery slip?", "인수증(납품서)에 기록해 주시겠어요?"], ["Could you note it on the inspection form?", "검수 양식에 기록해 주시겠어요?"]]}], "quiz": [{"q": "‘앞 범퍼가 찌그러진 걸 봤어요’를 영어로?", "o": ["I noticed a dent on the front bumper.", "I noticed a dent at front bumper.", "I was noticing dent the front bumper."], "a": 0, "why": "dent = 찌그러짐, scratch = 긁힘, crack = 금.", "id": "w10d1q1"}, {"q": "‘Thanks for pointing that out.’의 뜻은?", "o": ["짚어 주셔서(알려주셔서) 감사합니다.", "손가락으로 가리켜 주셔서 감사합니다.", "나가 주셔서 감사합니다."], "a": 0, "why": "point out = 지적하다, 알려주다.", "id": "w10d1q2"}, {"q": "B가 요청한 것은?", "o": ["수정된 계약서 사본", "차량 교체", "요금 할인"], "a": 0, "why": "Could I get a copy of the updated agreement?", "id": "w10d1q3"}], "id": "w10d1", "n": 1}, {"day": "화", "track": "여행", "title": "음식 재료 확인하기", "en": "Checking Ingredients", "scene": "식당에서 음식에 땅콩이 들어가는지 묻고, 들어가지 않은 메뉴로 주문하는 상황입니다.", "goal": "재료를 확인하고 대체 메뉴를 골라 주문할 수 있다.", "roles": {"A": "식당 직원", "B": "나"}, "lines": [{"s": "A", "en": "Are you ready to order, or do you have any questions?", "ko": "주문하시겠어요, 아니면 궁금한 점 있으세요?"}, {"s": "B", "en": "Does this soup contain peanuts?", "ko": "이 수프에 땅콩이 들어가나요?"}, {"s": "A", "en": "No, but it has sesame oil in it.", "ko": "아니요, 하지만 참기름이 들어가요."}, {"s": "B", "en": "I see. Which dishes are nut-free?", "ko": "그렇군요. 견과류가 안 들어간 요리는 어떤 거예요?"}, {"s": "A", "en": "The grilled fish and the chicken salad are nut-free.", "ko": "생선구이와 치킨 샐러드에는 견과류가 없어요."}, {"s": "B", "en": "Great. I'll have the hin ten working days.", "ko": "그렇다면 영업일 기준 10일 이내에 납품할 수 있습니다."}, {"s": "A", "en": "Does that include customs clearance?", "ko": "통관 기간도 포함인가요?"}, {"s": "B", "en": "No. Customs may take two more days.", "ko": "아니요. 통관은 이틀 더 걸릴 수 있습니다."}], "exps": [{"p": "Do you mean ___ or ___?", "ko": "___을 말씀하시나요, ___을 말씀하시나요?", "subs": [["Do you mean the unit price or the total price?", "단가를 말씀하시나요, 총액을 말씀하시나요?"], ["Do you mean this month or next month?", "이번 달을 말씀하시나요, 다음 달을 말씀하시나요?"], ["Do you mean the site or the warehouse?", "현장을 말씀하시나요, 창고를 말씀하시나요?"]]}, {"p": "In that case, ___.", "ko": "그렇다면 ___. (조건에 따라 답하기)", "subs": [["In that case, we can deliver within ten working days.", "그렇다면 영업일 기준 10일 이내에 납품할 수 있습니다."], ["In that case, the price will be lower.", "그렇다면 가격이 더 낮아집니다."], ["In that case, we need a new schedule.", "그렇다면 새 일정이 필요합니다."]]}], "quiz": [{"q": "‘단가를 말씀하시나요, 총액을 말씀하시나요?’를 영어로?", "o": ["Do you mean the unit price or the total price?", "Are you mean the unit price or the total price?", "Do you mean unit price and total price?"], "a": 0, "why": "Do you mean A or B?로 질문의 뜻을 좁혀 확인합니다.", "id": "w10d3q1"}, {"q": "‘within ten working days’의 뜻은?", "o": ["영업일 기준 10일 이내", "10일 동안 작업", "10일 뒤부터"], "a": 0, "why": "within = ~ 이내, working days = 영업일.", "id": "w10d3q2"}, {"q": "통관은 납품 기간에 포함되나요?", "o": ["아니요, 이틀 더 걸릴 수 있음", "네, 포함됨", "아니요, 열흘 더 걸림"], "a": 0, "why": "No. Customs may take two more days.", "id": "w10d3q3"}], "id": "w10d3", "n": 3}, {"day": "목", "track": "비즈니스", "title": "발표 마무리하고 다음 단계 제안하기", "en": "Closing a Presentation", "scene": "발표를 마무리하며 핵심 효과를 한마디로 요약하고, 근거와 다음 단계를 제안하는 상황입니다.", "goal": "핵심을 요약하고 근거를 제시한 뒤 후속 일정을 제안할 수 있다.", "roles": {"A": "협력사 담당자 Ms. Taylor", "B": "나"}, "lines": [{"s": "A", "en": "Before we finish, what's the main benefit of your proposal?", "ko": "마치기 전에, 제안의 가장 큰 장점은 뭔가요?"}, {"s": "B", "en": "In short, it will cut the installation time by thirty percent.", "ko": "한마디로, 설치 기간을 30% 줄일 수 있습니다."}, {"s": "A", "en": "How can you be sure about  번 더 확인하시죠."}, {"s": "B", "en": "Good idea. First, the total price includes delivery to our site.", "ko": "좋습니다. 먼저, 총액에는 현장까지의 운송비가 포함됩니다."}, {"s": "A", "en": "Correct. What about the payment terms?", "ko": "맞습니다. 결제 조건은요?"}, {"s": "B", "en": "We'll pay thirty percent in advance and the rest after inspection.", "ko": "선급금 30%, 잔금은 검수 후에 지급합니다."}, {"s": "A", "en": "Right. And the warranty is twelve months.", "ko": "맞습니다. 그리고 보증 기간은 12개월이고요."}, {"s": "B", "en": "Yes, starting from the delivery date, right?", "ko": "네, 납품일부터 시작하는 거죠?"}, {"s": "A", "en": "That's right. Everything matches my notes.", "ko": "맞습니다. 제 메모와 모두 일치합니다."}, {"s": "B", "en": "Great. I'll send you a written summary this afternoon.", "ko": "좋습니다. 오늘 오후에 서면 요약본을 보내드리겠습니다."}], "exps": [{"p": "The total price ___.", "ko": "총액에는 ___. (포함 범위 확인)", "subs": [["The total price includes delivery.", "총액에는 운송비가 포함됩니다."], ["The total price includes installation.", "총액에는 설치비가 포함됩니다."], ["The total price doesn't include VAT.", "총액에는 부가세가 포함되지 않습니다."]]}, {"p": "We'll pay ___ in advance and the rest ___.", "ko": "___은 선급으로, 잔금은 ___ 지급합니다.", "subs": [["We'll pay thirty percent in advance and the rest after inspection.", "30%는 선급, 잔금은 검수 후 지급합니다."], ["We'll pay half in advance and the rest on delivery.", "절반은 선급, 잔금은 납품 시 지급합니다."], ["We'll pay ten percent in advance and the rest in two installments.", "10%는 선급, 잔금은 두 번에 나눠 지급합니다."]]}], "quiz": [{"q": "‘총액에는 부가세가 포함되지 않습니다’를 영어로?", "o": ["The total price doesn't include VAT.", "The total price isn't include VAT.", "The total price doesn't includes VAT."], "a": 0, "why": "doesn't + 동사원형(include).", "id": "w11d3q1"}, {"q": "잔금 지급 시점은?", "o": ["검수 후", "납품 전", "계약 즉시"], "a": 0, "why": "the rest after inspection.", "id": "w11d3q2"}, {"q": "‘in advance’의 뜻은?", "o": ["미리, 선불로", "나중에", "한꺼번에"], "a": 0, "why": "pay in advance = 미리 지급하다 (선급금).", "id": "w11d3q3"}], "id": "w11d3", "n": 3}, {"day": "목", "track": "비즈니스", "title": "시차 고려해 후속 회의 잡기", "en": "Scheduling Across Time Zones", "scene": "출장 후 런던 거래처와 시차를 고려해 온라인 후속 회의 시간을 정하는 상황입니다.", "goal": "누구 기준 시간인지 확인하며 날짜와 시간을 조율할 수 있다.", "roles": {"A": "런던 거래처 담당자 Ms. Taylor", "B": "나"}, "lines": [{"s": "A", "en": "Let's have a follow-up call next week.", "ko": "다음 주에 후속 통화를 하시죠."}, {"s": "B", "en": "Sure. I'm available next Wednesday.", "ko": "좋습니다. 다음 주 수요일에 됩니다."}, {"s": "A", "en": "Would 9 a.m. my time work for you?", "ko": "제 쪽 시간으로 오전 9시 괜찮으세요?"}, {"s": "B", "en": "Hmm, that's 5 p.m. in Seoul. Could we make it a little earlier?", "ko": "음, 서울은 오후 5시네요. 조금 더 일찍 할 수 있을까요?"}, {"s": "A", "en": "How about 8 a.m. my time? That's 4 p.m. for you.", "ko": "제 쪽 시간 오전 8시는요? 그쪽은 오후 4시고요."}, {"s": "B", "en": "That works for me. So, Wednesday at 4 p.m. Seoul time, right?", "ko": "좋습니다. 그러니까 수요일 서울 시간 오후 4시 맞죠?"}, {"s": "A", "en": "Exactly. I'll send a calendar invite.", "ko": "맞습니다. 일정 초대를 보내드릴게요."}, {"s": "B", "en": "Great. I'll prepare the updated drawings.", "ko": "좋습니다. 수정 도면을 준비하겠습니다."}], "exps": [{"p": "Could we make it ___?", "ko": "___으로 할 수 있을까요? (시간 조정)", "subs": [["Could we make it a little earlier?", "조금 더 일찍 할 수 있을까요?"], ["Could we make it Thursday instead?", "대신 목요일로 할 수 있을까요?"], ["Could we make it 3 p.m.?", "오후 3시로 할 수 있을까요?"]]}, {"p": "That's ___ in Seoul.", "ko": "서울은 ___입니다. (시차 계산해 말하기)", "subs": [["That's 5 p.m. in Seoul.", "서울은 오후 5시입니다."], ["That's midnight in Seoul.", "서울은 자정입니다."], ["That's early morning in Seoul.", "서울은 이른 아침입니다."]]}], "quiz": [{"q": "‘대신 목요일로 할 수 있을까요?’를 영어로?", "o": ["Could we make it Thursday instead?", "Could we make Thursday it instead?", "Could we instead making Thursday?"], "a": 0, "why": "make it + 시간/날짜 = 그때로 정하다.", "id": "w11d4q1"}, {"q": "최종 회의 시간(서울 기준)은?", "o": ["수요일 오후 4시", "수요일 오후 5시", "수요일 오전 8시"], "a": 0, "why": "런던 오전 8시 = 서울 오후 4시.", "id": "w11d4q2"}, {"q": "‘Would 9 a.m. my time work for you?’에서 my time은?", "o": ["말하는 사람(런던) 쪽 현지 시간", "서울 시간", "내가 편한 시간"], "a": 0, "why": "my time = 말하는 사람이 있는 곳의 시간. 시차가 있을 때는 누구 기준인지 꼭 확인합니다.", "id": "w11d4 const hasTTS = "speechSynthesis" in window;
const SR = window.SpeechRecognition || window.webkitSpeechRecognition || null;
let voices = [], playToken = 0;
function loadVoices(){ if(!hasTTS) return; voices = speechSynthesis.getVoices().filter(v=>/^en[-_]/i.test(v.lang)); }
if (hasTTS){ loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; }
function pickVoice(role){
  if (!voices.length) return null;
  const us = voices.filter(v=>/en[-_]US/i.test(v.lang));
  const pool = us.length ? us : voices;
  const pref = pool.find(v=>/Samantha|Google US English|Aria|Jenny/i.test(v.name)) || pool[0];
  if (role === "A"){ const other = pool.find(v=>v !== pref && /male|Daniel|Alex|Guy|Fred|Aaron/i.test(v.name)) || pool.find(v=>v!==pref); return other || pref; }
  return pref;
}
function stopSpeak(){ if (typeof recActive!=="undefined" && recActive){ try{ recActive.abort(); }catch(e){} } playToken++; if (hasTTS) speechSynthesis.cancel(); markPlaying(null); }
function speakOne(text, role, rate){
  return new Promise(res=>{
    if (!hasTTS){ res(); return; }
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "en-US"; u.rate = rate || P.settings.rate;
    const v = pickVoice(role); if (v) u.voice = v;
    if (role === "A") u.pitch = 1.08; else u.pitch = 0.95;
    let doneFlag = false; const fin = ()=>{ if(!doneFlag){ doneFlag=true; res(); } };
    u.onend = fin; u.onerror = fin;
    setTimeout(fin, 1800 + text.length * 140 / (u.rate||1));
    speechSynthesis.speak(u);
  });
}
async function playSeq(items, rate){
  if (!hasTTS){ toast("이 브라우저는 음성 재생을 지원하지 않습니다."); return; }
  stopSpeak(); const t = playToken;
  for (const it of items){
    if (t !== playToken) return;
    markPlaying(it.key);
    await speakOne(it.en, it.s, rate);
    if (t !== playToken) return;
    await new Promise(r=>setTimeout(r, 350));
  }
  if (t === playToken) markPlaying(null);
}
function markPlaying(key){

/* ============ 레슨 ============ */
const STEPS_N = [ ["상황",1],["대화 듣기",2],["핵심 표현",2],["따라 말하기",3],["역할극",1],["퀴즈",1] ];
const STEPS_R = [ ["표현 카드",3],["복습 퀴즈",4] ];

function openLesson(id){
  const l = allItems().find(x=>x.id===id); if (!l) return;
  if (!weekUnlocked(l.week)){ toast((l.week-1)+"주차 5과를 모두 마치면 열립니다."); return; }
  let quiz;
  if (l.review){
    const wq = W(l.week).lessons.flatMap(x=>x.quiz);
    const wrongQ = P.wrong.map(q=>wq.find(x=>x.id===q)).filter(Boolean);
    const rest = shuffle(wq.filter(q=>!P.wrong.includes(q.id)));
    quiz = [...wrongQ, ...rest].slice(0, 8);
  } else quiz = l.quiz.slice();
  quiz = quiz.map(q=>({...q, order: shuffle([0,1,2])}));
  cur = { l, step:0, showKo:P.settings.showKo, sh:0, reps:{}, role:0, roleShown:{}, qi:0, picked:null, correct:0, quiz, start:Date.now() };
  clearInterval(timerId);
  timerId = setInterval(()=>{ const t=document.getElementById("tmr"); if(t) t.textContent = mmss(Date.now()-cur.start); }, 1000);
  renderLesson();
}
function steps(){ return cur.l.review ? STEPS_R : STEPS_N; }

function renderLesson(){
  stopSpeak();
  const l = cur.l, S = steps(), st = cur.step;
  const pct = Math.round((st+1)/S.length*100);
  let body = "";
  const kind = S[st][0];
  if (kind==="상황") body = vScene(l);
  else if (kind==="대화 듣기") body = vListen(l);
  else if (kind==="핵심 표현") body = vExp(l.exps);
  else if (kind==="따라 말하기") body = vShadow(l);
  else if (kind==="역할극") body = vRole(l);
  else if (kind==="퀴즈" || kind==="복습 퀴즈") body = vQuiz();
  else if (kind==="표현 카드") body = vExp(W(cur.l.week).lessons.flatMap(x=>x.exps), true);

  const last = st === S.length-1;
  const quizBlock = (kind==="퀴즈"||kind==="복습 퀴즈") && cur.qi < cur.quiz.length;
  $app.innerHTML = `
    <div class="lbar">
      <div class="row"><button class="back" data-act="home">‹ 홈</button><span class="row" style="gap:8px"><button class="modebtn" data-act="dark" aria-label="다크 모드 전환">${P.settings.dark?"☀":"☾"}</button><span class="timer" id="tmr">${mmss(Date.now()-cur.start)}</span></span></div>
      <div class="prog"><i style="width:${pct}%"></i></div>
      <div class="steplabel"><span><b>${st+1}/${S.length}</b> ${S[st][0]}</span><span>권장 ${S[st][1]}분</span></div>
    </div>
    ${body}
    <div class="bottom"><div class="in">
      <button class="btn ghost" data-act="prev" ${st===0?"disabled":""}>이전</button>
      <button class="btn primary" data-act="next" ${quizBlock?"disabled":""}>${last?"학습 완료":"다음"}</button>
    </div></div>`;
  window.scrollTo(0,0);
}

function vScene(l){
  return `<div class="stitle">${esc(l.title)}</div><div class="sdesc">${esc(l.en)}</div>
  <div class="ticket"><div class="t-main stack">
    <div class="mono muted">SCENE · WEEK ${pad2(l.week)} · DAY 0${l.n} · ${l.day}</div>
    <div class="scene-em">${esc(l.scene)}</div>
  </div><div class="perf"></div><div class="t-stub" style="display:block">
    <dl class="kv" style="margin:0">
      <dt>오늘 목표</dt><dd>${esc(l.goal)}</dd>
      <dt>A 역할</dt><dd>${esc(l.roles.A)}</dd>
      <dt>B 역할</dt><dd>${esc(l.roles.B)}${(P.me&&P.me.call)?" ("+esc(P.me.call)+")":""}</dd>
    </dl></div></div>
  <div class="note" style="margin-top:14px">순서: 대화 듣기 → 핵심 표현 → 따라 말하기 → 역할극 → 퀴즈</div>`;
}

function vListen(l){
  const lines = l.lines.map((x,i)=>`<button class="line ${x.s==="B"?"me":""}" data-act="say" data-i="${i}" data-key="L${i}"><span class="spk">${x.s}</span><span><div class="en">${esc(x.en)}</div>${cur.showKo?'<div class="ko">'+esc(x.ko)+'</div>':""}</span></button>`).join("");
  return `<div class="stitle">대화 듣기</div><div class="sdesc">먼저 느리게 한 번, 보통 속도로 한 번 들어보세요. 문장을 누르면 그 문장만 들립니다.</div>
  <div class="ctrls"><button class="btn soft" data-act="playAll" data-r="0.7">${PLAY} 느리게 전체</button><button class="btn primary" data-act="playAll" data-r="">${PLAY} 보통 속도</button></div>
  <div class="toggle-row"><span>한글 해석</span><button class="switch" role="switch" aria-label="한글 해석" aria-checked="${cur.showKo}" data-act="lessonKo"></button></div>
  <div class="stack" style="gap:8px">${lines}</div>`;
}

function vExp(exps, isReview){
  const cards = exps.map((e,ei)=>`
    <div class="card exp">
      <div class="mono muted">표현 ${ei+1}</div>
      <div class="pattern">${pat(e.p)}</div>
      <div class="muted" style="font-size:14px;margin-top:-6px">${esc(e.ko)}</div>
      <div class="mono muted" style="margin-top:4px">바꿔 말하기</div>
      ${e.subs.map((s,si)=>`<button class="sub" data-act="sayText" data-t="${esc(s[0])}"><span class="play">${PLAY}</span><span><div style="font-weight:600">${esc(s[0])}</div><div class="ko">${esc(s[1])}</div></span></button>`).join("")}
    </div>`).join("");
  return `<div class="stitle">${isReview?"이번 주 표현 카드":"핵심 표현"}</div>
  <div class="sdesc">${isReview?"이번 주에 배운 표현 10개입니다. 하나씩 듣고 소리 내어 읽어보세요.":"빈칸에 다른 단어를 넣어 말해보세요. 누르면 소리가 나옵니다."}</div>
  <div class="stack">${cards}</div>`;
}

function vShadow(l){
  const mine = l.lines.map((x,i)=>({...x,i})).filter(x=>x.s==="B");
  const k = Math.min(cur.sh, mine.length-1); const x = mine[k];
  const r = cur.reps[k]||0;
  return `<div class="stitle">따라 말하기</div><div class="sdesc">내 대사만 연습합니다. 듣고 → 소리 내어 3번 따라 말한 뒤 체크하세요.</div>
  <div class="card stack" style="padding:20px">
    <div class="row between"><span class="mono muted">문장 ${k+1} / ${mine.length}</span><span class="chip ${r>=3?"done":"wait"}">${r>=3?"완료":r+"/3회"}</span></div>
    <div class="shadow-big">${esc(x.en)}</div>
    <div class="ko" style="font-size:15px">${esc(x.ko)}</div>
    <div class="ctrls" style="margin:6px 0 0"><button class="btn soft" data-act="sayText" data-t="${esc(x.en)}" data-r="0.7">${PLAY} 느리게</button><button class="btn primary" data-act="sayText" data-t="${esc(x.en)}">${PLAY} 듣기</button></div>
    <div class="reps">${[0,1,2].map(j=>`<span class="rep ${j<r?"on":""}"></span>`).join("")}</div>
    ${SR ? `<button class="btn primary block" data-act="listen" id="srBtn" ${r>=3?"disabled":""}>🎤 말하고 발음 확인</button>` : ""}
    <div id="srRes" aria-live="polite"></div>
    <button class="btn ghost block" data-act="rep" ${r>=3?"disabled":""}>${SR?"직접 체크 (+1)":"소리 내어 따라 말했어요 (+1)"}</button>
  </div>
  <div class="pager">
    <button class="btn sm ghost" data-act="shPrev" ${k===0?"disabled":""}>‹ 이전 문장</button>
    <span class="mono muted">${mine.map((_,j)=>(cur.reps[j]||0)>=3?"●":"○").join(" ")}</span>
    <button class="btn sm ghost" data-act="shNext" ${k>=mine.length-1?"disabled":""}>다음 문장 ›</button>
  </div>`;
}

function vRole(l){
  const idx = cur.role; const L = l.lines;
  let out = "";
  for (let i=0;i<L.length && i<=idx;i++){
    const x = L[i];
    if (x.s==="A"){
      out += `<button class="line" data-act="sayText" data-s="A" data-t="${esc(x.en)}" data-key="R${i}"><span class="spk">A</span><span><div class="en">${esc(x.en)}</div><div class="ko">${esc(x.ko)}</div><div class="mono" style="color:var(--accent);margin-top:4px">▶ 눌러서 듣기</div></span></button>`;
    } else if (cur.roleShown[i]){
      out += `<div class="line me" data-key="R${i}"><span class="spk">B</span><span><div class="en">${esc(x.en)}</div><div class="ko">${esc(x.ko)}</div></span></div>`;
    } else {
      out += `<div class="card hint stack"><div class="mono" style="color:var(--accent)">내 차례 · 영어로 말해보세요</div><div style="font-size:18px;font-weight:600">${esc(x.ko)}</div><button class="btn primary block" data-act="reveal" data-i="${i}">정답 확인하고 듣기</button></div>`;
    }
  }
  const curLine = L[Math.min(idx, L.length-1)];
  const waitingReveal = curLine.s==="B" && !cur.roleShown[idx];
  const finished = idx >= L.length-1 && !waitingReveal;
  let ctl = "";
  if (!waitingReveal && !finished) ctl = `<button class="btn soft block" data-act="roleNext">다음 대사 ›</button>`;
  if (finished) ctl = `<div class="fb good"><b>역할극 완료</b>처음부터 다시 하려면 아래 버튼을 누르세요.</div><button class="btn ghost block" data-act="roleReset">처음부터 다시</button>`;
  return `<div class="stitle">역할극</div><div class="sdesc">상대(A) 대사를 듣고, 내 차례에는 한글을 보고 먼저 영어로 말해본 뒤 정답을 확인하세요.</div>
  <div class="stack" style="gap:8px">${out}${ctl}</div>`;
}

function vQuiz(){
  const Q = cur.quiz;
  if (cur.qi >= Q.length){
    return `<div class="stitle">퀴즈 결과</div><div class="sdesc">틀린 문제는 토요일 복습에 먼저 나옵니다.</div>
      <div class="card" style="text-align:center;padding:24px"><div class="mono muted">SCORE</div><div style="font-size:44px;font-weight:700;font-variant-numeric:tabular-nums">${cur.correct} / ${Q.length}</div>
      <div class="muted">${cur.correct===Q.length?"모두 맞혔습니다.":"‘학습 완료’를 눌러 오늘 과정을 마치세요."}</div></div>`;
  }
  const q = Q[cur.qi]; const picked = cur.picked;
  const opts = q.order.map(oi=>{
    let cls = "";
    if (picked!==null){ if (oi===q.a) cls="right"; else if (oi===picked) cls="wrong"; }
    return `<button class="opt ${cls}" data-act="pick" data-o="${oi}" ${picked!==null?"disabled":""}>${esc(q.o[oi])}</button>`;
  }).join("");
  const fb = picked===null ? "" : (picked===q.a ? `<div class="fb good"><b>정답입니다</b>${esc(q.why)}</div>` : `<div class="fb bad"><b>정답: ${esc(q.o[q.a])}</b>${esc(q.why)}</div>`);
  const nextBtn = picked===null ? "" : `<button class="btn primary block" data-act="qNext">${cur.qi===Q.length-1?"결과 보기":"다음 문제 ›"}</button>`;
  return `<div class="stitle">${cur.l.review?"복습 퀴즈":"퀴즈"}</div><div class="sdesc">문제 ${cur.qi+1} / ${Q.length}${cur.l.review && P.wrong.includes(q.id)?" · 지난번에 틀린 문제":""}</div>
    <div class="stack"><div class="q-prompt">${esc(q.q)}</div>${opts}${fb}${nextBtn}</div>`;
}

function finishLesson(){
  const l = cur.l; const secs = Math.round((Date.now()-cur.start)/1000);
  const nextW = l.week+1, wasOpen = weekUnlocked(nextW);
  P.done[l.id] = { date: todayStr(), secs };
  if (!wasOpen && weekUnlocked(nextW)) setTimeout(()=>toast(nextW+"주차가 열렸습니다. 토요일 복습 후 이어서 진행하세요."), 700);
  viewWeek = null;
  const t = todayStr(); if (!P.days.includes(t)) P.days.push(t);
  save();
  clearInterval(timerId); stopSpeak();
  const nx = nextLesson();
  $app.innerHTML = `
    <div class="stamp"><div><span>W${pad2(l.week)} · DAY 0${l.n}</span><b>DONE</b><span>${todayStr().replaceAll("-",".")}</span></div></div>
    <div style="text-align:center" class="stack">
      <h1 style="font-size:24px">${esc(l.title)} 완료</h1>
      <div class="muted">학습 시간 ${mmss(secs*1000)}${l.review?"":" · 퀴즈 "+cur.correct+"/"+cur.quiz.length}</div>
    </div>
    ${attCard()}
    <div class="sec card stack">
      <div class="mono muted">오늘 배운 표현</div>
      ${(l.review?[]:l.exps).map(e=>`<button class="sub" data-act="sayText" data-t="${esc(e.subs[0][0])}"><span class="play">${PLAY}</span><span><div style="font-weight:600">${pat(e.p)}</div><div class="ko">${esc(e.ko)}</div></span></button>`).join("") || '<div class="muted">이번 주 표현 10개를 복습했습니다. 내일은 쉬는 날입니다.</div>'}
    </div>
    <div class="sec stack">
      <button class="btn primary block" data-act="home">홈으로</button>
      ${nx?`<button class="btn ghost block" data-act="open" data-id="${nx.id}">다음 과 미리 하기: ${esc(nx.title)}</button>`:""}
    </div>`;
  cur = null; window.scrollTo(0,0);
}

/* ============ 음성인식 ============ */
const normW = t => t.toLowerCase().replace(/[’‘]/g,"'").replace(/n't\b/g," not").replace(/'m\b/g," am").replace(/'re\b/g," are").replace(/'s\b/g," is").replace(/'ll\b/g," will").replace(/'d\b/g," would").replace(/'ve\b/g," have").replace(/a\.m\./g,"am").replace(/p\.m\./g,"pm").replace(/[^a-z0-9' ]/g," ").split(/\s+/).filter(Boolean);
function matchWords(target, heard){
  const T = normW(target), H = normW(heard);
  const dp = Array.from({length:T.length+1},()=>new Array(H.length+1).fill(0));
  for (let i=T.length-1;i>=0;i--) for (let j=H.length-1;j>=0;j--) dp[i][j] = T[i]===H[j] ? dp[i+1][j+1]+1 : Math.max(dp[i+1][j], dp[i][j+1]);
  const ok = new Array(T.length).fill(false); let i=0,j=0;
  while(i<T.length && j<H.length){ if(T[i]===H[j]){ ok[i]=true; i++; j++; } else if (dp[i+1][j]>=dp[i][j+1]) i++; else j++; }
  const hit = ok.filter(Boolean).length;
  return { words:T, ok, score: T.length ? Math.round(hit/T.length*100) : 0 };
}
let recActive = null;
function startListen(){
  if (!SR || !cur) return;
  if (recActive){ try{ recActive.abort(); }catch(e){} recActive=null; }
  stopSpeak();
  const mine = cur.l.lines.filter(x=>x.s==="B"); const k = Math.min(cur.sh, mine.length-1); const target = mine[k].en;
  const btn = document.getElementById("srBtn"), out = document.getElementById("srRes");
  const rec = new SR(); recActive = rec;
  rec.lang = "en-US"; rec.interimResults = false; rec.maxAlternatives = 3; rec.continuous = false;
  if (btn){ btn.textContent = "듣는 중… 지금 말하세요"; btn.classList.add("listening"); }
  let got = false;
  rec.onresult = ev => {
    got = true;
    const alts = Array.from(ev.results[0]||[]).map(a=>a.transcript);
    let best = null, heard = "";
    for (const h of alts){ const m = matchWords(target, h); if (!best || m.score > best.score){ best = m; heard = h; } }
    if (!best) return;
    const pass = best.score >= 80;
    if (pass){ cur.reps[k] = Math.min(3, (cur.reps[k]||0)+1); }
    const wordsHtml = best.words.map((w,i)=>`<span class="${best.ok[i]?"ok":"miss"}">${esc(w)}</span>`).join(" ");
    const html = `<div class="fb ${pass?"good":"bad"}" style="margin-top:4px"><b>일치율 ${best.score}% ${pass?"· 통과 (+1)":"· 80% 이상이면 통과"}</b>인식된 말: “${esc(heard)}”</div><div class="sr-words" style="margin-top:8px">${wordsHtml}</div><div class="note">초록색은 인식된 단어, 빨간 밑줄은 인식되지 않은 단어입니다.</div>`;
    const y = window.scrollY; renderLesson(); window.scrollTo(0,y);
    const o2 = document.getElementById("srRes"); if (o2) o2.innerHTML = html;
    if (pass && (cur.reps[k]||0) >= 3 && k < mine.length-1) toast("이 문장 완료. ‘다음 문장’으로 넘어가세요.");
  };
  rec.onerror = ev => {
    const msg = ev.error==="not-allowed" || ev.error==="service-not-allowed" ? "마이크 권한이 꺼져 있습니다. 아이폰 설정 → Safari → 마이크(또는 설정 → 개인정보 보호 → 마이크, 음성 인식)에서 허용해 주세요."
      : ev.error==="no-speech" ? "소리가 들리지 않았습니다. 버튼을 누르고 바로 말해보세요."
      : "음성인식을 하지 못했습니다 ("+ev.error+"). 인터넷 연결을 확인하거나 직접 체크를 눌러주세요.";
    if (out) out.innerHTML = `<div class="fb bad" style="margin-top:4px">${esc(msg)}</div>`;
  };
  rec.onend = () => { recActive = null; const b2=document.getElementById("srBtn"); if (b2 && !got){ b2.textContent="🎤 말하고 발음 확인"; b2.classList.remove("listening"); } };
  try { rec.start(); } catch(e){ if (out) out.innerHTML = `<div class="fb bad">음성인식을 시작하지 못했습니다. 잠시 후 다시 눌러주세요.</div>`; }
}

/* ============ 백업 ============ */
function mergeImport(obj){
  if (!obj || typeof obj!=="object" || !obj.days || !obj.done) throw new Error("형식");
  P.days = Array.from(new Set([...(P.days||[]), ...obj.days])).sort();
  if (obj.contentVer === CONTENT_VER){
    P.done = Object.assign({}, obj.done, P.done);
    P.wrong = Array.from(new Set([...(P.wrong||[]), ...(obj.wrong||[])]));
  }
  if (obj.me && !(P.me && P.me.first)) P.me = obj.me;
  save(); personalize(); renderHome(); toast("백업을 불러와 기록을 합쳤습니다.");
}
function backupText(){ return JSON.stringify({app:"haru10", v:1, exportedAt:new Date().toISOString(), ...P}); }

/* ============ 출석 ============ */
function parseD(s){ const [y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d); }
function fmtD(s){ const d=parseD(s); return (d.getMonth()+1)+"."+d.getDate(); }
// 두 학습일 사이에 빠진 날이 일요일(쉬는 날)뿐이면 연속으로 본다
function connected(a,b){ const d=parseD(a); d.setDate(d.getDate()+1); const e=parseD(b);
  while(d<e){ if(d.getDay()!==0) return false; d.setDate(d.getDate()+1); } return true; }
function attendance(){
  const days = Array.from(new Set(P.days)).sort(); const today = todayStr();
  if (!days.length) return null;
  const runs=[]; let r={start:days[0],end:days[0],len:1};
  for(let i=1;i<days.length;i++){ if(connected(days[i-1],days[i])){ r.end=days[i]; r.len++; } else { runs.push(r); r={start:days[i],end:days[i],len:1}; } }
  runs.push(r);
  const last = runs[runs.length-1];
  const current = (last.end===today || connected(last.end,today)) ? last.len : 0;
  // 출석률 = 학습한 날(월~토) ÷ 첫 학습일부터 오늘까지의 학습 대상일(월~토) × 100
  let target=0; const d=parseD(days[0]), e=parseD(today);
  while(d<=e){ if(d.getDay()!==0) target++; d.setDate(d.getDate()+1); }
  const attended = days.filter(x=>parseD(x).getDay()!==0 && x<=today).length;
  const rate = target ? Math.min(100, Math.round(attended/target*100)) : 0;
  return { total:days.length, current, broken:runs.length>1, restart:last.start, best:Math.max(...runs.map(x=>x.len)), breaks:runs.length-1, attended, target, rate };
}
function attCard(){
  const A = attendance(); if (!A) return "";
  let head, sub;
  if (!A.broken){
    head = A.total===1 ? "1일차" : "연속 "+A.current+"일차";
    sub = A.total===1 ? "첫 학습을 마쳤습니다. 내일도 이어가세요." : "한 번도 빠지지 않고 "+A.current+"일째 학습 중입니다.";
  } else {
    head = "재개 "+A.current+"일차<small>누적 "+A.total+"일차</small>";
    sub = fmtD(A.restart)+"에 다시 시작해 "+A.current+"일째 이어가고 있습니다. 중단 전까지 포함하면 누적 "+A.total+"일입니다.";
  }
  return `<div class="sec att">
    <div class="mono" style="color:var(--accent)">출석</div>
    <div class="att-h" style="margin-top:6px">${head}</div>
    <div class="muted" style="font-size:14px;margin-top:4px">${esc(sub)}</div>
    <div style="margin-top:14px" class="row between"><b>출석률 ${A.rate}%</b><span class="muted" style="font-size:13px">${A.attended}일 ÷ ${A.target}일</span></div>
    <div class="meter"><i style="width:${A.rate}%"></i></div>
    <div class="att-grid">
      <div><b>${A.total}일</b><span>누적 학습일</span></div>
      <div><b>${A.current}일</b><span>${A.broken?"재개 후 연속":"현재 연속"}</span></div>
      <div><b>${A.best}일</b><span>최장 연속</span></div>
    </div>
    <div class="note" style="margin-top:10px">출석률 = 학습한 날(월~토) ÷ 첫 학습일부터 오늘까지의 월~토 일수 × 100. 일요일은 쉬는 날이라 빠져도 연속이 끊기지 않고, 출석률 계산에서도 뺍니다.${A.broken?" 중단 "+A.breaks+"회.":""}</div>
  </div>`;
}

document.addEventListener("change", e=>{
  if (e.target && e.target.id==="importFile" && e.target.files && e.target.files[0]){
    const fr = new FileReader(); fr.onload = ()=>{ try{ mergeImport(JSON.parse(fr.result)); }catch(err){ toast("백업 파일 형식이 맞지 않습니다."); } }; fr.readAsText(e.target.files[0]);
  }
});
/* ============ 이벤트 ============ */
document.addEventListener("click", e=>{
  const b = e.target.closest("[data-act]"); if (!b || b.disabled) return;
  const a = b.dataset.act;
  if (a==="open") return openLesson(b.dataset.id);
  if (a==="home") return renderHome();
  if (a==="week"){ viewWeek = +b.dataset.w; renderHome(); const el=document.getElementById("weekList"); if (el) el.scrollIntoView({block:"start"}); return; }
  if (a==="weekLocked"){ toast(((+b.dataset.w)-1)+"주차 5과를 모두 마치면 열립니다."); return; }
  if (a==="rate"){ P.settings.rate = parseFloat(b.dataset.v); save(); return renderHome(); }
  if (a==="dark"){ P.settings.dark = !P.settings.dark; applyMode(); save(); return cur ? renderLessonKeep() : renderHome(); }
  if (a==="listen") return startListen();
  if (a==="saveMe"){
    const g = id => (document.getElementById(id)||{}).value||"";
    P.me = { call:g("meCall").trim(), kname:g("meKname").trim(), first:g("meFirst").trim(), last:g("meLast").trim(), co:g("meCo").trim() };
    save(); personalize(); renderHome(); toast("저장했습니다. 대화문에 반영됐습니다."); return;
  }
  if (a==="exportFile"){
    try{ const blob = new Blob([backupText()], {type:"application/json"}); const u = URL.createObjectURL(blob);
      const el = document.createElement("a"); el.href = u; el.download = "haru10-backup-"+todayStr()+".json"; document.body.appendChild(el); el.click(); el.remove(); setTimeout(()=>URL.revokeObjectURL(u), 4000);
      toast("백업 파일을 만들었습니다. ‘파일’ 앱에 저장하세요."); }catch(e){ toast("파일 저장을 지원하지 않습니다. ‘백업 코드 복사’를 이용하세요."); }
    return;
  }
  if (a==="exportCopy"){
    const t = backupText();
    const ok = ()=>toast("백업 코드를 복사했습니다. 메모 앱 등에 붙여넣어 보관하세요.");
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(ok).catch(()=>{ const ta=document.getElementById("importText"); ta.value=t; ta.select(); toast("자동 복사가 안 되어 아래 칸에 넣었습니다. 길게 눌러 복사하세요."); });
    else { const ta=document.getElementById("importText"); ta.value=t; ta.select(); toast("아래 칸의 코드를 길게 눌러 복사하세요."); }
    return;
  }
  if (a==="importText"){ try{ mergeImport(JSON.parse(document.getElementById("importText").value)); }catch(e){ toast("백업 코드 형식이 맞지 않습니다."); } return; }
  if (a==="showKo"){ P.settings.showKo = !P.settings.showKo; save(); return renderHome(); }
  if (a==="testVoice") return playSeq([{en:"Hello! Let's practice English for ten minutes today.", s:"B"}]);
  if (a==="sayText") return playSeq([{en:b.dataset.t, s:b.dataset.s||"B", key:b.dataset.key}], b.dataset.r?parseFloat(b.dataset.r):undefined);
  if (!cur) return;
  const S = steps();
  if (a==="prev"){ if (cur.step>0){ cur.step--; renderLesson(); } return; }
  if (a==="next"){ if (cur.step < S.length-1){ cur.step++; renderLesson(); } else finishLesson(); return; }
  if (a==="lessonKo"){ cur.showKo = !cur.showKo; return renderLesson(); }
  if (a==="playAll"){ const r = b.dataset.r?parseFloat(b.dataset.r):undefined; return playSeq(cur.l.lines.map((x,i)=>({en:x.en,s:x.s,key:"L"+i})), r); }
  if (a==="say"){ const i=+b.dataset.i; const x=cur.l.lines[i]; return playSeq([{en:x.en,s:x.s,key:"L"+i}]); }
  if (a==="rep"){ const k=cur.sh; cur.reps[k]=(cur.reps[k]||0)+1; const mine=cur.l.lines.filter(x=>x.s==="B"); if (cur.reps[k]>=3 && k<mine.length-1){ cur.sh++; } return renderLessonKeep(); }
  if (a==="shPrev"){ cur.sh=Math.max(0,cur.sh-1); return renderLessonKeep(); }
  if (a==="shNext"){ cur.sh++; return renderLessonKeep(); }
  if (a==="roleNext"){ cur.role++; renderLessonKeep(); const x=cur.l.lines[cur.role]; if (x && x.s==="A") playSeq([{en:x.en,s:"A",key:"R"+cur.role}]); scrollEnd(); return; }
  if (a==="reveal"){ const i=+b.dataset.i; cur.roleShown[i]=true; renderLessonKeep(); playSeq([{en:cur.l.lines[i].en,s:"B",key:"R"+i}]); scrollEnd(); return; }
  if (a==="roleReset"){ cur.role=0; cur.roleShown={}; renderLessonKeep(); const x=cur.l.lines[0]; playSeq([{en:x.en,s:x.s,key:"R0"}]); return; }
  if (a==="pick"){ const q=cur.quiz[cur.qi]; cur.picked=+b.dataset.o;
    if (cur.picked===q.a){ cur.correct++; P.wrong = P.wrong.filter(w=>w!==q.id); } else if (!P.wrong.includes(q.id)) P.wrong.push(q.id);
    save(); return renderLessonKeep(); }
  if (a==="qNext"){ cur.qi++; cur.picked=null; return renderLesson(); }
});
function renderLessonKeep(){ const y = window.scrollY; renderLesson(); window.scrollTo(0,y); }
function scrollEnd(){ requestAnimationFrame(()=>window.scrollTo({top:document.body.scrollHeight, behavior:"smooth"})); }

/* 역할극 첫 진입 시 A 대사 자동 재생은 하지 않음(모바일은 터치 후에만 소리 가능). */
renderHome();
if ("serviceWorker" in navigator){ window.addEventListener("load", ()=>{ navigator.serviceWorker.register("sw.js").catch(()=>{}); }); }
